<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

<div class="contenedorMain">
    <div class="card text-center" style="width: 35rem; background-color:lightgrey">

        <div class="card-header" style="background-color: grey">
            <img src="imgs/cenaInvit.jpg" class="card-img-top"  alt="">
        </div>

        <div class="card-body">
            <h5 class="card-title">Special title treatment</h5>
            <p class="card-text">
                With supporting text below as a natural lead-in to additional content.
            </p>
        </div>

        <div class="cardAsist p-3">

            <div class="accordion" id="respuestaAccordion">

                <div class="accordion-item" >
                    <h2 class="accordion-header" >
                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#respuestaSi">
                            SI
                        </button>
                    </h2>
                    <div
                        id="respuestaSi"
                        class="accordion-collapse collapse"
                        data-bs-parent="#respuestaAccordion">
                        <div class="accordion-body">
                            <div class="card text-center">
                                <div class="card-body">
                                    <h5 class="card-title">Menu de navidad</h5>
                                    <p class="card-text">pollo </p>
                                </div>
                                    <form>
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                            <label class="form-check-label" for="exampleCheck1">Check me out</label>
                                        </div>

                                    </form>
                                </div>
                                <div class="card-footer">
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="accordion-item" style="background-color: darkgreen; color: white" >
                    <h2 class="accordion-header">
                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#respuestaNo">
                            NO
                        </button>
                    </h2>

                    <div
                        id="respuestaNo"
                        class="accordion-collapse collapse"
                        data-bs-parent="#respuestaAccordion">
                        <div class="accordion-body">
                            Nos vemos el año que viene. Felices fiestas.
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
